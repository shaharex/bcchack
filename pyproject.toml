[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements-validator"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6,<1",
    "pydantic>=2.9,<3",
    "google-genai>=1.50,<3",
    "httpx>=0.28.1,<1",
    "markdown-it-py>=3,<5",
    "PyMuPDF>=1.24,<2",
    "Jinja2>=3.1,<4",
    "python-dotenv>=1,<2",
    # zoneinfo needs an IANA database on Windows for the executable check.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
export = ["weasyprint==70.0", "python-docx==1.2.0"]

[tool.setuptools]
packages = ["requirements_validator", "report_template"]
package-dir = {"" = "src", report_template = "report_template"}

[tool.setuptools.package-data]
requirements_validator = ["templates/*.j2"]
report_template = ["*.j2", "*.css", "fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
