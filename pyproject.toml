[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements-validator"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "google-genai>=1.50,<3",
    "httpx>=0.28.1,<1",
    "markdown-it-py>=3,<5",
    "PyMuPDF>=1.24,<2",
    "Jinja2>=3.1,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
requirements_validator = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
